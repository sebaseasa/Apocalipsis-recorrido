<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Apocalipsis: recorrido</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="rotulos"></div>
    <div id="vineta"></div>
    <div id="calidez"></div>
    <div id="fundido"></div>

    <div id="paso" class="paso"></div>
    <div id="fps" class="fps" hidden></div>

    <div class="pie">
      <div id="aviso" class="aviso">Toca para continuar</div>
      <div id="subtitulo" class="subtitulo" aria-live="polite"></div>
    </div>

    <div id="barra" class="barra" hidden>
      <button id="boton-pausa" type="button">⏸ Pausa</button>
      <button id="boton-caminar" type="button">🚶 Caminar</button>
      <button id="boton-menu" type="button">☰ Menú</button>
    </div>
    <div id="palanca" class="palanca" hidden><div class="perilla"></div></div>

    <section id="inicio" class="inicio">
      <h1>Apocalipsis</h1>
      <p class="cita">Biblia inmersiva · Reina-Valera 1909</p>
      <p id="carga" class="nota">Cargando…</p>
      <div id="menu" class="menu" hidden>
        <p class="titulo-grupo">Capítulo 1</p>
        <button class="opcion" type="button" data-escena="1">
          La visión de Juan en Patmos<small>Versículos 9 al 20</small>
        </button>
        <p class="titulo-grupo">Capítulos 2 y 3<small>Las cartas a las siete iglesias</small></p>
        <button class="opcion" type="button" data-escena="2" data-iglesia="todas">Las siete cartas seguidas<small>Apocalipsis 2:1 al 3:22</small></button>
        <p class="titulo-capitulo">Capítulo 2</p>
        <div id="lista-cap2" class="lista-iglesias"></div>
        <p class="titulo-capitulo">Capítulo 3</p>
        <div id="lista-cap3" class="lista-iglesias"></div>
      </div>
      <p class="nota">Sube el volumen 🔊</p>
    </section>

    <section id="reflexion" class="reflexion" hidden>
      <p class="iglesia" id="reflexion-iglesia"></p>
      <p class="etiqueta">Para reflexionar</p>
      <p class="pregunta" id="reflexion-pregunta"></p>
      <div class="botones">
        <button id="reflexion-siguiente" type="button">Siguiente iglesia</button>
        <button id="reflexion-repetir" type="button">Repetir esta carta</button>
        <button id="reflexion-menu" type="button">Menú</button>
      </div>
    </section>

    <section id="cierre" class="cierre" hidden>
      <figure class="grabado">
        <img id="grabado" class="marco" alt="Alberto Durero, La visión de los siete candeleros (1498)" />
        <figcaption>Alberto Durero, <em>La visión de los siete candeleros</em>, 1498</figcaption>
      </figure>
      <p class="pregunta">¿Qué te dice que Jesús camine en medio de su iglesia?</p>
      <div class="botones">
        <button id="otra-vez" type="button">Volver a empezar</button>
        <button id="cierre-menu" type="button">Menú</button>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
